name: Bug report
description: Report a problem with the ModelPulse example app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Never paste Fedo API keys or the contents of `local.properties`.**
        Bugs in the Fedo Android SDK itself belong in the SDK repository (see the links on the previous page).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 16 (API 37)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
      placeholder: Pixel 9 Pro, or Pixel 9 API 37 emulator
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App commit or version
      placeholder: Commit SHA, e.g. a57dfc7
    validations:
      required: true
  - type: input
    id: fedo-sdk-version
    attributes:
      label: Fedo SDK version
      placeholder: com.getfedo:sdk-android:0.4.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logcat output or a stack trace. Remove API keys and any other secrets before pasting.
      render: shell
